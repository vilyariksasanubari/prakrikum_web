
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hubungi Kami - Portofolio</title>

    <!-- Menghubungkan CSS eksternal -->
    <link rel="stylesheet" href="20251320011_style.css">

    <style>
        /* HALAMAN KONTAK */
        .contact-page {
            max-width: 750px;
            margin: 40px auto;
            padding: 30px;
            background: #f7f8fa;
            border-radius: 12px;
        }

        .contact-page h1 {
            margin-top: 0;
            color: #087bff;
            text-align: center;
        }

        .contact-page p {
            text-align: center;
            color: #555;
        }

        .contact-form {
            margin-top: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label,
        .form-title {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        .form-group textarea {
            min-height: 140px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: 2px solid #087bff;
            border-color: #087bff;
        }

        .radio-option,
        .checkbox-option {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
        }

        .radio-option input,
        .checkbox-option input {
            width: auto;
        }

        .contact-form button {
            padding: 12px 22px;
            border: none;
            border-radius: 6px;
            background: #28a745;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .contact-form button:hover {
            background: #218838;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #087bff;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            .contact-page {
                margin: 20px 12px;
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- NAVBAR -->
        <header class="navbar">
            <h3 class="logo">Mahasiswa UKRI</h3>

            <nav>
                <a href="20251320011_m4_t1.html">Beranda</a>
                <a href="20251320011_m4_t1.html">Proyek</a>
                <a href="kontak.html">Kontak</a>
            </nav>
        </header>

        <!-- FORM HUBUNGI KAMI -->
        <main class="contact-page">

            <a href="20251320011_m4_t1.html" class="back-link">
                &larr; Kembali ke Beranda
            </a>

            <h1>Hubungi Kami</h1>

            <p>
                Punya pertanyaan atau ingin bekerja sama?
                Silakan isi formulir di bawah ini.
            </p>

            <form
                class="contact-form"
                action="mailto:vilyariksasanubari@gmail.com"
                method="post"
                enctype="text/plain"
            >

                <!-- NAMA -->
                <div class="form-group">
                    <label for="nama">Nama Lengkap:</label>
                    <input
                        type="text"
                        id="nama"
                        name="Nama"
                        placeholder="Masukkan nama lengkap"
                        required
                    >
                </div>

                <!-- EMAIL -->
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input
                        type="email"
                        id="email"
                        name="Email"
                        placeholder="nama@email.com"
                        required
                    >
                </div>

                <!-- NOMOR TELEPON -->
                <div class="form-group">
                    <label for="telepon">Nomor Telepon:</label>
                    <input
                        type="tel"
                        id="telepon"
                        name="Nomor Telepon"
                        placeholder="Contoh: 08xxxxxxxxxx"
                    >
                </div>

                <!-- TOPIK PESAN -->
                <div class="form-group">
                    <label for="topik">Topik Pesan:</label>
                    <select id="topik" name="Topik Pesan" required>
                        <option value="">Pilih topik pesan</option>
                        <option value="Pertanyaan Umum">
                            Pertanyaan Umum
                        </option>
                        <option value="Kerja Sama">
                            Kerja Sama
                        </option>
                        <option value="Pembuatan Website">
                            Pembuatan Website
                        </option>
                        <option value="Desain Grafis">
                            Desain Grafis
                        </option>
                        <option value="Lainnya">Lainnya</option>
                    </select>
                </div>

                <!-- ISI PESAN -->
                <div class="form-group">
                    <label for="pesan">Pesan Anda:</label>
                    <textarea
                        id="pesan"
                        name="Pesan"
                        placeholder="Tuliskan pesan Anda di sini..."
                        required
                    ></textarea>
                </div>

                <!-- SUMBER INFORMASI -->
                <div class="form-group">
                    <span class="form-title">
                        Bagaimana Anda Mengetahui Kami?
                    </span>

                    <label class="radio-option">
                        <input
                            type="radio"
                            name="Sumber Informasi"
                            value="Media Sosial"
                            required
                        >
                        Media Sosial
                    </label>

                    <label class="radio-option">
                        <input
                            type="radio"
                            name="Sumber Informasi"
                            value="Mesin Pencari"
                        >
                        Mesin Pencari
                    </label>

                    <label class="radio-option">
                        <input
                            type="radio"
                            name="Sumber Informasi"
                            value="Rekomendasi Teman"
                        >
                        Rekomendasi Teman
                    </label>

                    <label class="radio-option">
                        <input
                            type="radio"
                            name="Sumber Informasi"
                            value="Lainnya"
                        >
                        Lainnya
                    </label>
                </div>

                <!-- PERSETUJUAN -->
                <div class="form-group">
                    <label class="checkbox-option">
                        <input
                            type="checkbox"
                            name="Persetujuan"
                            value="Disetujui"
                            required
                        >
                        Saya menyetujui syarat dan ketentuan.
                    </label>
                </div>

                <!-- TOMBOL KIRIM -->
                <button type="submit">Kirim Pesan</button>

            </form>

        </main>

        <!-- FOOTER -->
        <footer>
            <p>
                &copy; 2025 Mahasiswa UKRI.
                Dibuat dengan penuh semangat.
            </p>
        </footer>

    </div>

</body>
</html>
